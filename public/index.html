<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cc-live Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #c9d1d9;
      height: calc(var(--vh, 1vh) * 100);
      display: flex;
      overflow: hidden;
    }

    /* Login overlay */
    #login-overlay {
      position: fixed; inset: 0;
      background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #login-overlay.hidden { display: none; }
    .login-box {
      text-align: center;
      padding: 2rem;
    }
    .login-box h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #58a6ff; }
    .login-box input {
      padding: 0.6rem 1rem; width: 280px; max-width: 80vw;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; font-size: 1rem; outline: none;
    }
    .login-box input:focus { border-color: #58a6ff; }
    .login-box button {
      margin-left: 0.5rem; padding: 0.6rem 1.2rem;
      background: #238636; border: none; border-radius: 6px;
      color: #fff; font-size: 1rem; cursor: pointer;
    }
    .login-box button:hover { background: #2ea043; }
    .login-error { color: #f85149; margin-top: 0.5rem; font-size: 0.85rem; }

    /* Sidebar */
    #sidebar {
      width: 280px; min-width: 280px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #30363d;
      font-size: 0.9rem; font-weight: 600; color: #58a6ff;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .session-count {
      background: #30363d; border-radius: 10px;
      padding: 0.1rem 0.5rem; font-size: 0.75rem; color: #8b949e;
    }
    #session-list {
      flex: 1; overflow-y: auto; padding: 0.5rem;
    }
    .session-item {
      padding: 0.7rem 0.8rem; margin-bottom: 0.3rem;
      border-radius: 6px; cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .session-item:hover { background: #1c2128; }
    .session-item.active { background: #1c2128; border-color: #58a6ff; }
    .session-hostname {
      font-weight: 600; font-size: 0.85rem; color: #c9d1d9;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #3fb950; display: inline-block; flex-shrink: 0;
    }
    .session-cwd {
      font-size: 0.75rem; color: #8b949e;
      margin-top: 0.2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-meta {
      font-size: 0.7rem; color: #6e7681; margin-top: 0.3rem;
      display: flex; gap: 0.8rem;
    }

    /* No sessions placeholder */
    .no-sessions {
      text-align: center; padding: 2rem 1rem; color: #6e7681;
    }
    .no-sessions-icon { font-size: 2rem; margin-bottom: 0.5rem; }

    /* Main area */
    #main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Tab bar */
    #tab-bar-wrapper {
      display: flex; background: #161b22;
      border-bottom: 1px solid #30363d;
      min-height: 36px;
    }
    #tab-bar {
      display: flex; flex: 1;
      overflow-x: auto;
    }
    .tab {
      padding: 0.5rem 1rem; font-size: 0.8rem;
      cursor: pointer; border-right: 1px solid #30363d;
      white-space: nowrap; display: flex; align-items: center; gap: 0.5rem;
      color: #8b949e; transition: background 0.15s;
    }
    .tab:hover { background: #1c2128; }
    .tab.active { background: #0d1117; color: #c9d1d9; border-bottom: 2px solid #58a6ff; }
    .tab-close {
      font-size: 0.7rem; opacity: 0.5; padding: 2px 4px; border-radius: 3px;
    }
    .tab-close:hover { opacity: 1; background: #30363d; }

    /* Terminal area */
    #terminal-area {
      flex: 1; position: relative; background: #1e1e1e;
    }
    .terminal-container {
      position: absolute; inset: 0; padding: 4px;
      display: none;
    }
    .terminal-container.active { display: block; }

    /* Empty state */
    #empty-state {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #6e7681; font-size: 0.9rem;
    }

    /* Font size controls */
    .font-controls {
      display: flex; align-items: center; gap: 2px;
      margin-left: auto; flex-shrink: 0;
    }
    .font-btn {
      background: none; border: 1px solid #30363d; border-radius: 4px;
      color: #8b949e; font-size: 0.75rem; cursor: pointer;
      padding: 2px 6px; line-height: 1.2;
    }
    .font-btn:hover { background: #30363d; color: #c9d1d9; }
    .font-size-label {
      font-size: 0.7rem; color: #6e7681; min-width: 24px; text-align: center;
    }

    /* Mobile toolbar - hidden on desktop */
    #mobile-toolbar { display: none; }
    #sidebar-close { display: none; }

    @media (max-width: 768px) {
      body { flex-direction: column; }

      #mobile-toolbar {
        display: flex; align-items: center;
        height: 44px; padding: 0 12px; flex-shrink: 0;
        background: #161b22; border-bottom: 1px solid #30363d;
      }
      #menu-btn {
        background: none; border: none; color: #c9d1d9;
        font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
      }
      #mobile-title {
        flex: 1; text-align: center; font-size: 0.85rem;
        color: #8b949e; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; padding: 0 8px;
      }
      .font-btn { padding: 4px 8px; font-size: 0.85rem; }

      #sidebar {
        position: fixed; inset: 0; z-index: 100;
        width: 100%; min-width: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      #sidebar.open { transform: translateX(0); }

      #sidebar-close {
        display: block;
        background: none; border: none; color: #8b949e;
        font-size: 1.5rem; cursor: pointer; padding: 4px 8px;
        margin-left: auto;
      }

      #tab-bar-wrapper { display: none; }

      #main { flex: 1; min-height: 0; }

      .terminal-container { padding: 0; }

      .login-box button { margin-left: 0; margin-top: 0.5rem; display: block; width: 100%; }
      .login-box input { display: block; width: 80vw; max-width: 280px; margin: 0 auto; }
    }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h1>cc-live Dashboard</h1>
    <div>
      <input id="token-input" type="password" placeholder="Enter token..." />
      <button id="login-btn">Connect</button>
    </div>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="mobile-toolbar">
  <button id="menu-btn">&#9776;</button>
  <span id="mobile-title">cc-live</span>
  <button class="font-btn" id="mobile-shift-tab" title="Send Shift+Tab">⇧Tab</button>
  <div class="font-controls">
    <button class="font-btn" id="mobile-font-dec">A-</button>
    <span class="font-size-label" id="mobile-font-label">7</span>
    <button class="font-btn" id="mobile-font-inc">A+</button>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    Sessions <span id="session-count" class="session-count">0</span>
    <button class="font-btn" id="logout-btn" style="margin-left: auto;">Logout</button>
    <button id="sidebar-close">&times;</button>
  </div>
  <div id="session-list">
    <div class="no-sessions" id="no-sessions">
      <div class="no-sessions-icon">&#9671;</div>
      No active sessions
    </div>
  </div>
</div>

<div id="main">
  <div id="tab-bar-wrapper">
    <div id="tab-bar"></div>
    <button class="font-btn" id="desktop-shift-tab" title="Send Shift+Tab" style="margin: auto 4px auto 8px;">⇧Tab</button>
    <div class="font-controls" id="desktop-font-controls" style="padding: 0 8px;">
      <button class="font-btn" id="desktop-font-dec">A-</button>
      <span class="font-size-label" id="desktop-font-label">14</span>
      <button class="font-btn" id="desktop-font-inc">A+</button>
    </div>
  </div>
  <div id="terminal-area">
    <div id="empty-state">Select a session from the sidebar</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(function() {
  // Fix mobile virtual keyboard covering terminal
  function updateVh() {
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  updateVh();

  // State
  let socket = null;
  let sessions = new Map(); // sessionId -> session info
  let tabs = new Map();     // sessionId -> { term, fitAddon, container }
  let activeTab = null;

  // DOM refs
  const loginOverlay = document.getElementById('login-overlay');
  const tokenInput = document.getElementById('token-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const sessionList = document.getElementById('session-list');
  const sessionCount = document.getElementById('session-count');
  const noSessions = document.getElementById('no-sessions');
  const tabBar = document.getElementById('tab-bar');
  const terminalArea = document.getElementById('terminal-area');
  const emptyState = document.getElementById('empty-state');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menu-btn');
  const sidebarClose = document.getElementById('sidebar-close');
  const mobileTitle = document.getElementById('mobile-title');
  const logoutBtn = document.getElementById('logout-btn');

  function isMobile() { return window.innerWidth <= 768; }
  function closeSidebar() { sidebar.classList.remove('open'); }
  function openSidebar() { sidebar.classList.add('open'); }

  // Font size controls
  let currentFontSize = isMobile() ? 7 : 14;
  const MIN_FONT = 4, MAX_FONT = 24;

  // Auto-fit: adjust font size so remote session cols always fit in container width
  function autoFit(tab) {
    const container = tab.container;
    const cols = tab.sessionCols;
    const availableWidth = container.clientWidth - 8; // subtract padding
    const availableHeight = container.clientHeight - 8;
    if (availableWidth <= 0 || availableHeight <= 0) return;

    // Measure actual monospace character width at font size 10 for accurate ratio
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = '10px Menlo, Monaco, "Courier New", monospace';
    const charWidthAt10 = ctx.measureText('M').width;
    const charWidthRatio = charWidthAt10 / 10; // width per 1px of font size

    // Calculate font size that fits all cols in available width
    const idealFontSize = Math.floor(availableWidth / (cols * charWidthRatio));
    const newSize = Math.max(MIN_FONT, Math.min(MAX_FONT, idealFontSize));

    tab.term.options.fontSize = newSize;
    currentFontSize = newSize;
    document.querySelectorAll('.font-size-label').forEach(el => el.textContent = newSize);

    // Use fitAddon to get accurate row count at current font size, but keep session cols
    const dims = tab.fitAddon.proposeDimensions();
    const fittedRows = dims ? dims.rows : Math.max(1, Math.floor(availableHeight / (newSize * 1.2)));

    tab.term.resize(cols, fittedRows);
  }

  function updateFontSize(delta) {
    currentFontSize = Math.max(MIN_FONT, Math.min(MAX_FONT, currentFontSize + delta));
    tabs.forEach((tab) => {
      tab.term.options.fontSize = currentFontSize;
      // Recalculate rows at new font size, keep session cols
      const dims = tab.fitAddon.proposeDimensions();
      const rows = dims ? dims.rows : tab.sessionRows;
      tab.term.resize(tab.sessionCols, rows);
    });
    // Update all labels
    document.querySelectorAll('.font-size-label').forEach(el => {
      el.textContent = currentFontSize;
    });
  }

  // Wire up both mobile and desktop font buttons
  document.getElementById('mobile-font-dec').onclick = () => updateFontSize(-1);
  document.getElementById('mobile-font-inc').onclick = () => updateFontSize(1);
  document.getElementById('desktop-font-dec').onclick = () => updateFontSize(-1);
  document.getElementById('desktop-font-inc').onclick = () => updateFontSize(1);

  // Shift+Tab button — sends escape sequence \x1b[Z
  function sendShiftTab() {
    if (activeTab && socket && socket.connected) {
      socket.emit('input', { sessionId: activeTab, data: '\x1b[Z' });
    }
  }
  document.getElementById('mobile-shift-tab').onclick = sendShiftTab;
  document.getElementById('desktop-shift-tab').onclick = sendShiftTab;

  menuBtn.onclick = () => {
    sidebar.classList.toggle('open');
  };
  sidebarClose.onclick = closeSidebar;

  function disconnectSocket() {
    if (!socket) return;
    socket.removeAllListeners();
    socket.disconnect();
    socket = null;
  }

  function resetDashboardState() {
    sessions.clear();
    tabs.forEach((tab) => {
      tab.term.dispose();
      tab.container.remove();
    });
    tabs.clear();
    tabBar.innerHTML = '';
    activeTab = null;
    emptyState.style.display = '';
    mobileTitle.textContent = 'cc-live';
    renderSessionList();
  }

  function showLogin(message) {
    loginError.textContent = message || '';
    loginOverlay.classList.remove('hidden');
  }

  function hideLogin() {
    loginError.textContent = '';
    loginOverlay.classList.add('hidden');
    tokenInput.value = '';
  }

  async function postJson(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body || {}),
    });

    let payload = {};
    try {
      payload = await response.json();
    } catch {
      payload = {};
    }

    if (!response.ok) {
      const message = typeof payload.error === 'string'
        ? payload.error
        : `Request failed (${response.status})`;
      throw new Error(message);
    }

    return payload;
  }

  function loadSessions(currentSocket) {
    currentSocket.emit('list-sessions', (list) => {
      sessions.clear();
      list.forEach(s => sessions.set(s.sessionId, s));
      renderSessionList();
    });
  }

  function connectViewer(options = {}) {
    const { silentAuthFailure = false } = options;

    disconnectSocket();
    const currentSocket = io('/viewer', {
      transports: ['websocket'],
    });
    let hasConnected = false;
    socket = currentSocket;

    currentSocket.on('connect', () => {
      if (socket !== currentSocket) return;
      hasConnected = true;
      hideLogin();
      loadSessions(currentSocket);
    });

    currentSocket.on('connect_error', (err) => {
      if (socket !== currentSocket) return;
      const message = err && err.message ? err.message : 'Unknown error';
      if (message === 'Authentication failed') {
        disconnectSocket();
        resetDashboardState();
        if (!hasConnected && silentAuthFailure) {
          showLogin('');
          return;
        }
        showLogin(hasConnected
          ? 'Session expired. Please log in again.'
          : 'Authentication failed.');
        return;
      }
      if (!hasConnected) {
        disconnectSocket();
        resetDashboardState();
        showLogin('Connection failed: ' + message);
      }
    });

    currentSocket.on('auth-expired', () => {
      if (socket !== currentSocket) return;
      disconnectSocket();
      resetDashboardState();
      showLogin('Session expired. Please log in again.');
    });

    currentSocket.on('session-added', (s) => {
      sessions.set(s.sessionId, s);
      renderSessionList();
    });

    currentSocket.on('session-removed', ({ sessionId }) => {
      sessions.delete(sessionId);
      renderSessionList();
      const tab = tabs.get(sessionId);
      if (tab) {
        tab.term.write('\r\n\x1b[33m--- session ended ---\x1b[0m\r\n');
      }
    });

    currentSocket.on('scrollback', ({ sessionId, data }) => {
      const tab = tabs.get(sessionId);
      if (tab) tab.term.write(data);
    });

    currentSocket.on('session-output', ({ sessionId, data }) => {
      const tab = tabs.get(sessionId);
      if (tab) tab.term.write(data);
    });

    currentSocket.on('session-resize', ({ sessionId, cols, rows }) => {
      const tab = tabs.get(sessionId);
      if (tab) {
        tab.sessionCols = cols;
        tab.sessionRows = rows;
        autoFit(tab);
      }
    });

    currentSocket.on('session-disconnected', ({ sessionId }) => {
      const tab = tabs.get(sessionId);
      if (tab) {
        tab.term.write('\r\n\x1b[33m--- connection lost, waiting for reconnect... ---\x1b[0m\r\n');
      }
      const el = sessionList.querySelector(`.session-item[data-id="${sessionId}"]`);
      if (el) {
        const dot = el.querySelector('.status-dot');
        if (dot) dot.style.background = '#d29922';
      }
    });

    currentSocket.on('session-reconnected', ({ sessionId, cols, rows }) => {
      const tab = tabs.get(sessionId);
      if (tab) {
        tab.term.write('\r\n\x1b[32m--- reconnected ---\x1b[0m\r\n');
        tab.sessionCols = cols;
        tab.sessionRows = rows;
        autoFit(tab);
      }
      const el = sessionList.querySelector(`.session-item[data-id="${sessionId}"]`);
      if (el) {
        const dot = el.querySelector('.status-dot');
        if (dot) dot.style.background = '#3fb950';
      }
    });
  }

  async function loginWithToken(token) {
    const trimmedToken = token.trim();
    loginError.textContent = '';
    loginBtn.disabled = true;

    try {
      await postJson('/api/auth/login', { token: trimmedToken });
      connectViewer();
    } catch (err) {
      showLogin('Login failed: ' + err.message);
    } finally {
      loginBtn.disabled = false;
    }
  }

  async function logout() {
    logoutBtn.disabled = true;
    try {
      await postJson('/api/auth/logout', {});
    } catch {
    } finally {
      disconnectSocket();
      resetDashboardState();
      showLogin('');
      closeSidebar();
      logoutBtn.disabled = false;
    }
  }

  loginBtn.onclick = () => {
    loginWithToken(tokenInput.value);
  };
  tokenInput.onkeydown = (e) => {
    if (e.key === 'Enter') loginBtn.onclick();
  };
  logoutBtn.onclick = logout;

  const url = new URL(window.location.href);
  const urlToken = url.searchParams.get('token');
  if (urlToken !== null) {
    url.searchParams.delete('token');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
    loginWithToken(urlToken);
  } else {
    connectViewer({ silentAuthFailure: true });
  }

  function renderSessionList() {
    sessionCount.textContent = sessions.size;
    if (sessions.size === 0) {
      noSessions.style.display = '';
      // Clear all items except noSessions
      Array.from(sessionList.children).forEach(c => {
        if (c !== noSessions) c.remove();
      });
      return;
    }
    noSessions.style.display = 'none';

    // Remove stale items
    Array.from(sessionList.querySelectorAll('.session-item')).forEach(el => {
      if (!sessions.has(el.dataset.id)) el.remove();
    });

    // Add/update items
    sessions.forEach((s, id) => {
      let el = sessionList.querySelector(`.session-item[data-id="${id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'session-item';
        el.dataset.id = id;
        el.onclick = () => openTab(id);
        sessionList.appendChild(el);
      }
      el.classList.toggle('active', activeTab === id);

      const dur = formatDuration(Date.now() - s.connectedAt);
      const shortCwd = s.cwd.replace(/^\/home\/[^/]+/, '~');
      el.innerHTML = `
        <div class="session-hostname">
          <span class="status-dot"></span>
          ${escHtml(s.hostname)}
        </div>
        <div class="session-cwd" title="${escHtml(s.cwd)}">${escHtml(shortCwd)}</div>
        <div class="session-meta">
          <span>${dur}</span>
          <span>${s.viewerCount || 0} viewers</span>
        </div>
      `;
    });
  }

  function openTab(sessionId) {
    if (tabs.has(sessionId)) {
      switchTab(sessionId);
      return;
    }

    const session = sessions.get(sessionId);
    if (!session) return;

    // Create terminal container
    const container = document.createElement('div');
    container.className = 'terminal-container';
    container.dataset.id = sessionId;
    terminalArea.appendChild(container);

    const term = new Terminal({
      theme: {
        background: '#1e1e1e',
        foreground: '#d4d4d4',
        cursor: '#d4d4d4',
        selectionBackground: '#264f78',
        black: '#1e1e1e',
        red: '#f44747',
        green: '#6a9955',
        yellow: '#d7ba7d',
        blue: '#569cd6',
        magenta: '#c586c0',
        cyan: '#4ec9b0',
        white: '#d4d4d4',
        brightBlack: '#808080',
        brightRed: '#f44747',
        brightGreen: '#6a9955',
        brightYellow: '#d7ba7d',
        brightBlue: '#569cd6',
        brightMagenta: '#c586c0',
        brightCyan: '#4ec9b0',
        brightWhite: '#d4d4d4',
      },
      fontSize: currentFontSize,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      cursorBlink: true,
      scrollback: 10000,
      cols: session.cols || 80,
      rows: session.rows || 24,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);

    // Send input to remote session
    term.onData((data) => {
      if (socket && socket.connected) {
        socket.emit('input', { sessionId, data });
      }
    });

    tabs.set(sessionId, { term, fitAddon, container, sessionCols: session.cols || 80, sessionRows: session.rows || 24 });

    // Create tab in tab bar
    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.dataset.id = sessionId;
    tabEl.innerHTML = `
      <span>${escHtml(session.hostname)}:${escHtml(shortPath(session.cwd))}</span>
      <span class="tab-close" data-id="${sessionId}">&times;</span>
    `;
    tabEl.onclick = (e) => {
      if (e.target.classList.contains('tab-close')) {
        closeTab(sessionId);
      } else {
        switchTab(sessionId);
      }
    };
    tabBar.appendChild(tabEl);

    // Watch the session
    if (socket && socket.connected) {
      socket.emit('watch', { sessionId });
    }

    switchTab(sessionId);

    // On mobile, close sidebar after selecting a session
    if (isMobile()) closeSidebar();
  }

  function switchTab(sessionId) {
    activeTab = sessionId;
    emptyState.style.display = 'none';

    // Update mobile title
    const sess = sessions.get(sessionId);
    if (sess) {
      mobileTitle.textContent = sess.hostname + ':' + shortPath(sess.cwd);
    }

    // Update tab bar
    tabBar.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.id === sessionId);
    });

    // Update terminal containers
    terminalArea.querySelectorAll('.terminal-container').forEach(c => {
      c.classList.toggle('active', c.dataset.id === sessionId);
    });

    // Update sidebar
    sessionList.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === sessionId);
    });

    // Auto-fit font size (longer delay on mobile to wait for sidebar animation)
    const tab = tabs.get(sessionId);
    if (tab) {
      setTimeout(() => {
        autoFit(tab);
        tab.term.focus();
      }, isMobile() ? 250 : 50);
    }
  }

  function closeTab(sessionId) {
    const tab = tabs.get(sessionId);
    if (!tab) return;

    if (socket && socket.connected) {
      socket.emit('unwatch', { sessionId });
    }
    tab.term.dispose();
    tab.container.remove();
    tabs.delete(sessionId);

    // Remove tab from tab bar
    const tabEl = tabBar.querySelector(`.tab[data-id="${sessionId}"]`);
    if (tabEl) tabEl.remove();

    // Switch to another tab or show empty state
    if (tabs.size > 0) {
      switchTab(tabs.keys().next().value);
    } else {
      activeTab = null;
      emptyState.style.display = '';
    }

    renderSessionList();
  }

  // Resize handler (also handles mobile virtual keyboard show/hide)
  let resizeTimer;
  function handleResize() {
    updateVh();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (activeTab) {
        const tab = tabs.get(activeTab);
        if (tab) autoFit(tab);
      }
    }, 150);
  }
  window.addEventListener('resize', handleResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleResize);
  }

  // Duration timer
  setInterval(renderSessionList, 30000);

  // Helpers
  function formatDuration(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    return h + 'h ' + (m % 60) + 'm';
  }

  function shortPath(p) {
    const parts = p.split('/');
    return parts.length > 2 ? parts.slice(-2).join('/') : p;
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
